[package]
name = "todo_app"
version = "0.1.0"
edition = "2021"
authors = ["Platform-Projects Contributors"]
description = "A small CLI todo app (intentionally has bugs for testing practice)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[[bin]]
name = "todo"
path = "src/main.rs"
